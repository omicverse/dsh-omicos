name: OmicOS OSS
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.1', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific test environments
        run: |
          python -m pip install 'anndata>=0.12,<0.13' 'pandas>=2.2,<3' 'matplotlib>=3.9,<4'
          sudo apt-get update
          sudo apt-get install -y r-base-core r-cran-jsonlite
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          OMICOS_SCIENCE_TEST_PYTHON: python
      - run: pnpm test:package
      - name: Browser integration
        if: matrix.node == '24'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
        env:
          OMICOS_SCIENCE_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == '24'
        with:
          name: oss-browser-fixtures
          path: test-results/oss-browser
          if-no-files-found: ignore
