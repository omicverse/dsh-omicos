name: OmicOS OSS
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.1', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scientific test environments
        run: |
          python -m pip install 'anndata>=0.12,<0.13' 'pandas>=2.2,<3' 'matplotlib>=3.9,<4'
          sudo apt-get update
          sudo apt-get install -y r-base-core r-cran-jsonlite poppler-utils
      - name: Pinned public CJK font fixture
        run: |
          mkdir -p "$RUNNER_TEMP/omicos-fonts"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -o "$RUNNER_TEMP/omicos-fonts/NotoSansCJKsc-Regular.otf"
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $RUNNER_TEMP/omicos-fonts/NotoSansCJKsc-Regular.otf" | sha256sum --check
          echo "OMICOS_PDF_TEST_FONT=$RUNNER_TEMP/omicos-fonts/NotoSansCJKsc-Regular.otf" >> "$GITHUB_ENV"
          echo "OMICOS_PDF_QA_DIR=$GITHUB_WORKSPACE/test-results/oss-browser" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          OMICOS_SCIENCE_TEST_PYTHON: python
      - name: Independently render embedded CJK PDF
        run: |
          pdftotext test-results/oss-browser/cjk-publication.pdf test-results/oss-browser/cjk-publication.txt
          test "$(tr -d '[:space:]' < test-results/oss-browser/cjk-publication.txt)" = "科研"
          pdftoppm -singlefile -scale-to 1200 -png test-results/oss-browser/cjk-publication.pdf test-results/oss-browser/cjk-publication 2>test-results/oss-browser/cjk-render.log
          test ! -s test-results/oss-browser/cjk-render.log
      - run: pnpm test:package
      - run: node scripts/provision-orphan-smoke.cjs
      - name: Browser integration
        if: matrix.node == '24'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
        env:
          OMICOS_SCIENCE_TEST_PYTHON: python
      - name: Published Harness Web integration
        if: matrix.node == '24'
        run: pnpm test:harness-browser
        env:
          OMICOS_SCIENCE_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == '24'
        with:
          name: oss-browser-fixtures
          path: test-results/oss-browser
          if-no-files-found: ignore
